name: Feature request
description: Propose a user journey or security improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user journey or threat. Do not include sensitive data.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security effect
      description: State any effect on the wire format, identity, store, or managed service.
