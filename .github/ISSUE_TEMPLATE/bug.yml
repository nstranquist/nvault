name: Bug report
description: Report a reproducible nvault defect without sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, tokens, private keys, passphrases, or customer data.
  - type: input
    id: version
    attributes:
      label: Version
      description: Run `nvault version`.
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic values only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed all sensitive values and tested with synthetic data.
          required: true
