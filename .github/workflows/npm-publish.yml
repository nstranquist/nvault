name: Publish npm client

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing nvault release tag, for example v0.2.0-alpha.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the selected immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}"
          go run ./cmd/nvault-release --version "${RELEASE_TAG}" --output "${RUNNER_TEMP}/nvault-release-check"
      - run: corepack pnpm@11.15.1 --dir client install --frozen-lockfile
      - run: corepack pnpm@11.15.1 --dir client test
      - run: corepack pnpm@11.15.1 --dir client audit --prod
      - name: Select the npm distribution tag
        id: npm-dist-tag
        working-directory: client
        run: node scripts/npm-dist-tag.mjs
      - name: Use a trusted-publishing-capable npm CLI
        run: npm install --global npm@11.6.2
      - name: Publish with npm trusted publishing and provenance
        working-directory: client
        run: npm publish --access public --provenance --tag "${{ steps.npm-dist-tag.outputs.tag }}"
