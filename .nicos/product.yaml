schema_version: 1
id: product.nvault
name: nvault
surface: products
kind: product
status: experimental
persona: Teams and agents that need zero-knowledge secrets they can inspect.
jtbd: Protect local secrets and seal managed values on the client before sync.
pricing: Apache-2.0 engine; hosted cloud is the paid product.
launch: built
license: Apache-2.0
tags:
  - secrets
  - zero-knowledge
  - cli
  - go
checks:
  - name: version
    command:
      - go
      - run
      - ./cmd/nvault
      - version
  - name: crypto
    command:
      - go
      - test
      - ./...
  - name: schema-parity
    command:
      - go
      - run
      - ./cmd/nvault-schemagen
      - --check
      - client/src/types.generated.ts
description: >-
  Apache-2.0 nvault engine with envelope crypto, protected local storage,
  strict configuration, a first-run wizard, process injection, and the
  TypeScript client. It is locally publish-ready, but it is not public or
  released. nicos-tools keeps the proprietary hosted cloud.
